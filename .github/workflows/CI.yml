name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event.action != 'closed'
    name: Julia ${{ matrix.version }} - ${{ matrix.tier }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        # tiers run as parallel jobs: wall-clock is the slowest tier, not the sum
        tier:
          - unit
          - cases
          - distributed
        exclude:
          # MPI gate on the latest Julia release only
          - version: '1.10'
            tier: distributed
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          # the gate's three-rank files (asymmetric halos, sub-communicator, empty wall-function patch)
          XCALIBRE_TEST_MAX_RANKS: 3
        with:
          test_args: ${{ matrix.tier }}
          # Coverage instrumentation slows the solver loops (~6x on 1.10, ~90x on 1.12+), so it stays off
          coverage: false
